[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-charging-m1-m2"
version = "0.3.0"
description = "MILP baseline for electric-vehicle fast-charging station planning along Armenia's M1/M2 corridors"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
geospatial = ["osmnx>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

